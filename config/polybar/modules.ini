
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
enable-click = true

enable-scroll = true

icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-default = 0

format = <label-state>
format-background = ${color.background}
format-foreground = ${color.foreground}

label-monitor = %name%

label-active = %name%
label-active-background = ${color.shade8}
label-active-foreground = ${color.background}

label-occupied = %index%
label-occupied-background = ${color.background}
label-occupied-foreground = ${color.shade4}

label-urgent = %index%
label-urgent-background = ${color.background}
label-urgent-foreground = #CC6666

label-empty = %index%
label-empty-background = ${color.background}
label-empty-foreground = ${color.foreground}

label-active-padding = 2
label-urgent-padding = 2
label-occupied-padding = 2
label-empty-padding = 2

[module/pulseaudio]
type = internal/pulseaudio

sink = defaut

use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${color.foreground-alt}
format-volume-background = ${color.shade7}
format-volume-padding = 2

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-font = 2
format-muted-foreground = ${color.foreground-alt}
format-muted-background = ${color.shade8}
format-muted-padding = 2

label-volume = %percentage:3:3%%

label-muted = " Muted"
label-muted-foreground = ${color.foreground-alt}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-font = 2

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = scroll lock

format = <label-layout> <label-indicator>
format-prefix = 
format-prefix-font = 2
format-background = ${color.shade5}
format-foreground = ${color.background}
format-padding = 2

label-layout = " %layout%"

label-indicator-on = %name%
label-indicator-on-padding = 2
label-indicator-on-margin-left = 1
label-indicator-on-foreground = ${color.background}
label-indicator-on-background = ${color.shade8}

[module/memory]
type = internal/memory
interval = 1

format = <label>
format-prefix = 
format-prefix-font = 2
format-foreground = ${color.foreground-alt}
format-background = ${color.shade2}
format-padding = 2

label = " %mb_used%"

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = 
format-prefix-font = 2
format-foreground = ${color.foreground-alt}
format-background = ${color.shade5}
format-padding = 2

label = " %percentage:3:3%%"

[network-base]
type = internal/network
interval = 5

format-connected = <label-connected>
format-connected-background = ${color.shade1}
format-connected-foreground = ${color.background}
format-connected-padding = 2

format-disconnected = <label-disconnected>
format-disconnected-background = ${color.shade4}
format-disconnected-foreground = ${color.background}
format-disconnected-padding = 2


[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = 直 On
label-disconnected = 󰖪  Off

[module/eth]
inherit = network-base
interface-type = wired
label-connected = 󰈀  On
label-disconnected = 󰈂 Off

[module/date]
type = internal/date

interval = 1.0

time = " %I:%M %p"
time-alt = " %a, %d %b %Y"

format = <label>
format-prefix = 
format-prefix-font = 2
format-background = ${color.shade3}
format-foreground = ${color.foreground-alt}
format-padding = 2

label = %time%

[module/sep]
type = custom/text
format = " "

format-background = ${color.alpha}
format-foreground = ${color.alpha}

[module/backlight]
type = internal/backlight

enable-scroll = true
format = <ramp> <label>
use-actual-brightness = true
format-background = ${color.shade5}
format-foreground = ${color.foreground-alt}
format-padding = 2

label = %percentage:3:3%%

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
ramp-font = 2

[module/launcher]
type = custom/text
content = " " 

; "content" has the same properties as "format-NAME"
content-background = ${color.shade8}
content-foreground = ${color.background}
content-padding = 2

click-left = rofi-launcher
click-right = nippy-roar

[module/nippy-battery]
type = custom/script

exec = nippy-battery summary

interval = 5

format = <label>
format-prefix =  
format-prefix-font = 2
format-background = ${color.shade8}
format-foreground = ${color.background}
format-prefix-padding = 2

label = %output%

click-left = rofi-battery &

[module/nippy-network]
type = custom/script

exec = exec nippy-network

interval = 15

format = <label>
format-background = ${color.shade1}
format-foreground = ${color.background}
format-padding = 2

label = %output%

click-left = rofi-wifi &


[settings]
screenchange-reload = true
pseudo-transparency = false


