conky.config = {

	font  = 'JetBrains Mono:bold:size=8',  	-- the default font used
	font2 = 'Raleway:bold:size=10',         	-- font for the time
	font3 = 'Ubuntu:size=20',               	-- font for the date
	font4 = 'Raleway:bold:size=9',              -- font for the keybindings heading
	
	--catppuccin
 	color0 = '#C9CBFF',
	color1 = '#D9E0EE',
	color2 = '#89DCEB',
	color3 = '#F2CDCD',
	color4 = '#C3BAC6',
    color5 = '#ABE9B3',
    color6 = '#FAE3B0',
    
	background = true,
	update_interval = 1,

	double_buffer = true,
	no_buffers = true,
	text_buffer_size = 2048,

	alignment = 'top_right',
	gap_x = 25,
	gap_y = 50,

	short_units = true,

	minimum_height = 15,
	minimum_width = 200,
	maximum_width = 220,

	own_window = true,
	own_window_type = 'desktop',
	own_window_colour = '#C01e1e2e',	
	own_window_transparent = false,

	own_window_class = 'conky-semi',
	own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
	border_inner_margin = 10,
	border_outer_margin = 1,

	draw_shades = false,
	draw_outline = false,
	draw_borders = false,
	draw_graph_borders = true,

	override_utf8_locale = true,
	use_xft = true,
	font = 'Adwaita Sans:size=9',
	uppercase = false,
	imlib_cache_size = 0,

	default_color = '#FFFFFF',
	shade_color = '#000000',
	background_color = '#000000',
	
};

conky.text = [[

${alignc}${color0}${font3}${time %b %d, %Y}${font}
${distribution} ${alignr} ${kernel}
Uptime: ${uptime}

${color5}${font2}CPU ${alignr}${cpu}%${font}
${voffset 5}Temp: ${hwmon coretemp temp 1}°C ${alignr}${freq} Mhz
${cpubar 8}
${voffset 5}${top name 1}$alignr${top cpu 1}
${top name 2}$alignr${top cpu 2}
${top name 3}$alignr${top cpu 3}

${color6}${font2}MEMORY ${alignr} $memperc% ${font}
${voffset 5}Used: ${mem} ${alignr} Total: ${memmax} 
${membar 8}
${voffset 5}${top_mem name 1}$alignr${top_mem mem_res 1}
${top_mem name 2}$alignr${top_mem mem_res 2}
${top_mem name 3}$alignr${top_mem mem_res 3}

${color6}${font2}SWAP ${alignr} $swapperc% ${font}
${voffset 5}Used ${swap} ${alignr} Total: ${swapmax} 
##${swapbar 8}

${color3}${font2}FILESYSTEM ${font}
${voffset 5}ROOT:  ${fs_used_perc /}% ${alignr} ${fs_used /} / ${fs_size /} 
${fs_bar}
${voffset 5}HOME:  ${fs_used_perc /home}% ${alignr} ${fs_used /home} / ${fs_size /home} 
${fs_bar /home}

${color1}${font2}BATTERY ${font}
${voffset 5}BAT0: ${battery BAT0} ${alignr} ${battery_time BAT0}
${battery_bar 8 BAT0}
${voffset 5}BAT1: ${battery BAT1} ${alignr} ${battery_time BAT1}
${battery_bar 8 BAT1}

]];
