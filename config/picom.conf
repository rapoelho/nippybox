# --- Backend e Performance de Renderização ---
backend = "glx";
vsync = true;

# Desativar o use-damage é essencial para eliminar glitches no Firefox/GTK4,
# com o glx-no-stencil ativado, o impacto na bateria/desempenho é mínimo.
use-damage = false;

# --- Cantos Arredondados (Aparência Estável) ---
corner-radius = 5;

# Evita que cantos fiquem bugados em painéis, popups ou menus do sistema
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'i3bar'"
];

# --- Sombras (Shadows Otimizadas) ---
shadow = true;
shadow-radius = 6;       # Reduzido levemente para casar melhor com cantos de 5px
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.40;   # Sombra mais sutil e moderna

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'firefox' && argb",
  "class_g = 'Firefox' && argb",
  "_GTK_FRAME_EXTENTS@:c" # EVITA SOMBRAS DUPLAS E BORDAS PRETAS EM APPS GTK4
];

# --- Desvanecimento (Fading - Fluidez Visual) ---
# Efeito muito leve que dá uma sensação de suavidade premium sem pesar nada
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# --- Transparência e Opacidade ---
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
detect-client-opacity = true;
detect-rounded-corners = true;

# --- Ajustes por Tipo de Janela (Garante menus rápidos) ---
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; };
  popup_menu = { opacity = 1.0; shadow = false; }
  dropdown_menu = { opacity = 1.0; shadow = false; }
  dock = { shadow = false; }
  dnd = { shadow = false; }
};
