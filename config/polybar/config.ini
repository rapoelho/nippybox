include-file = colors.ini
include-file = modules.ini
include-file = more_modules.ini

[bar/main]
width = 98%
offset-x = 1%

height = 25pt
offset-y = 5px
radius = 0

background = ${color.alpha}
foreground = ${color.foreground}

padding-left = 0
padding-right = 0
bottom = true

font-0 = "Iosevka Nerd Font:pixelsize=9;4"
font-1 = "Iosevka Polybar:pixelsize=9;4"

modules-left = launcher sep xworkspaces sep xkeyboard
modules-right = systray sep  memory cpu sep wlan eth sep pulseaudio sep  backlight nippy-battery sep date

enable-ipc = true
